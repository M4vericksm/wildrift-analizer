[project]
name = "wildrift-analizer"
version = "0.1.0"
description = "Coach pessoal de Wild Rift — Fase 0 (ver docs/scope.md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
pipeline = [
    "opencv-python-headless>=4.10",
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["core", "backend", "backend.routers", "backend.services", "backend.pipeline", "scrapers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
